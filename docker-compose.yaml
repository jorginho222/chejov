services:
    api:
        build:
            context: .
            target: dev
        restart: "no"
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3000:3000"
        env_file:
            - path: .env
              required: false
            - path: .env.local
              required: false
        environment:
            - ENVIRONMENT=development
            - DB_HOST=db
            - DB_PORT=5432
            - DB_NAME=${POSTGRES_DB:-chejov}
            - DB_USER=${POSTGRES_USER:-postgres}
            - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        volumes:
            - .:/app
            - api_node_modules:/app/node_modules
        tmpfs:
            - /app/.data

    db:
        image: postgres:18
        restart: "no"
        ports:
            - "5433:5432"
        volumes:
            - .data/postgres:/var/lib/postgresql

        environment:
            - POSTGRES_DB=${POSTGRES_DB:-chejov}
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10

    adminer:
        image: adminer
        restart: "no"
        ports:
            - "8082:8080"

volumes:
    api_node_modules:
